# DSH bundle layer for self-contained Hindsight memory & governance.
#
# Works standalone as a single plugin (built-in Hindsight REST client,
# pages/recall/reflect injection, native hindsight_* tools, and Git seeding)
# without requiring @vectorize-io/hindsight-coding-agents. When that bundle is
# also installed and enabled, `memoryLane: auto` automatically keeps the
# built-in injection idle and wraps its recalls with budget governance.
#
# Everything here is tunable from this row's config; `autoTune: false` leaves the
# shared ~/.hindsight/coding-agent.json untouched. The tuner tool is read-only
# unless `allowAgentWrites: true`; user write paths are /hindsight tune and
# /hindsight revert.
- insert:
    - id: hindsight-tuner
      name: '@jameryw/dsh-hindsight-tuner'
      config:
        autoTune: true
        overwrite: false
        memoryLane: auto
        builtinTools: auto
        allowMemoryRetain: true
        autoSeed: false
        maxInjectTokens: 3000
        autoInject: pages
        injectTimeoutMs: 7000
        observationScopes: per_source
        recallMaxTokens: 2000
        tokenBudgetMode: fast
        # adaptive: pick a per-turn ceiling from this table (never above
        # maxInjectTokens). off: every recall gets the full cap.
        budgetPolicy: adaptive
        budgetTiers:
          light: 800
          normal: 1600
          deep: 3000
        # skip: a recall that mostly repeats what the model already received is
        # not injected again (the earlier message is still in context).
        repeatPolicy: skip
        repeatThreshold: 0.9
        # A recall is evidence, not authority: open it with a one-line reminder
        # to verify against the current code/tests. Counted in the same ceiling.
        verifyReminder: true
        allowAgentWrites: false
