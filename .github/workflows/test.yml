name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests (scenario + view + tokens)
        run: |
          node test/scenario.mjs
          node test/view.mjs
      - name: Smoke test
        run: node test/smoke.mjs
      - name: Standalone integration test
        run: node test/integration.mjs
      - name: A/B harness self-test
        run: node eval/selftest.mjs
